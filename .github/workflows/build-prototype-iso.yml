name: UNNAMED OS prototype ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prototype/live-build/**"
      - ".github/workflows/build-prototype-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring             squashfs-tools xorriso syslinux-common syslinux-utils             grub-pc-bin grub-efi-amd64-bin
      - name: Configure Debian live image
        working-directory: prototype/live-build
        run: |
          sudo lb config             --distribution bookworm             --architectures amd64             --binary-image iso-hybrid             --archive-areas "main contrib non-free-firmware"             --mirror-bootstrap http://deb.debian.org/debian             --mirror-chroot http://deb.debian.org/debian             --mirror-binary http://deb.debian.org/debian             --bootappend-live "boot=live components quiet"
      - name: Build ISO
        working-directory: prototype/live-build
        run: sudo lb build
      - name: Collect image
        run: |
          mkdir -p out
          sudo cp prototype/live-build/live-image-amd64.hybrid.iso out/unnamedos-prototype-amd64.iso
          sudo chown "$USER":"$USER" out/unnamedos-prototype-amd64.iso
      - uses: actions/upload-artifact@v4
        with:
          name: unnamedos-prototype-amd64-iso
          path: out/unnamedos-prototype-amd64.iso
          retention-days: 14
