name: UNNAMED OS prototype ISO

on:
  workflow_dispatch:
  push:
    branches: [prototype-0.1-bootable]
    paths:
      - "prototype/live-build/**"
      - "prototype/compositor/**"
      - "prototype/shell/**"
      - ".github/workflows/build-prototype-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso             syslinux-common syslinux-utils grub-pc-bin grub-efi-amd64-bin
      - name: Configure Debian live image
        run: |
          sudo lb config             --distribution stable             --architectures amd64             --binary-image iso-hybrid             --debian-installer live             --archive-areas "main contrib non-free-firmware"             --bootappend-live "boot=live components quiet"
        working-directory: prototype/live-build
      - name: Build ISO
        run: sudo lb build
        working-directory: prototype/live-build
      - name: Collect image
        run: |
          mkdir -p out
          sudo cp prototype/live-build/live-image-amd64.hybrid.iso out/unnamedos-prototype-amd64.iso
          sudo chown "$USER":"$USER" out/unnamedos-prototype-amd64.iso
      - uses: actions/upload-artifact@v4
        with:
          name: unnamedos-prototype-amd64-iso
          path: out/unnamedos-prototype-amd64.iso
          retention-days: 14
