name: compositor-check

on:
  push:
    paths:
      - "prototype/compositor/**"
      - ".github/workflows/compositor-check.yml"
  pull_request:
    paths:
      - "prototype/compositor/**"
      - ".github/workflows/compositor-check.yml"

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgles2-mesa-dev libudev-dev libinput-dev libgbm-dev libseat-dev libdisplay-info-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check compositor
        working-directory: prototype/compositor
        run: cargo check --locked
