[package]
name = "unnamed-compositor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "UNNAMED OS nested Wayland compositor feasibility prototype"

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "renderer_gl", "wayland_frontend"] }
wayland-protocols = { version = "0.32", features = ["server", "unstable", "staging"] }
wayland-server = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
